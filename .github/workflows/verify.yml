name: verify

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: python -m pip install --no-deps -r requirements-dev.lock
      - run: python -m pip check
      - run: python -m pip install --no-build-isolation --no-deps -e .
      - run: ruff format --check .
      - run: ruff check .
      - run: mypy src
      - run: pytest --cov --cov-report=term-missing
      - run: python -m pip wheel --no-build-isolation --no-deps --wheel-dir dist .
      - run: docker build --tag clinicflow-dependencies .
